<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monopoly Advanced Banker & Tracker</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 550px;
      width: 100%;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 5px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      color: #white;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .timer-display {
      font-size: 1.2em;
      font-weight: bold;
      font-family: monospace;
    }
    .vault-bar {
      display: flex;
      justify-content: space-around;
      background: #e2e8f0;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
      color: #334155;
    }
    .parking-card {
      background: #fef3c7;
      border: 2px solid #f59e0b;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .section h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #1e293b;
    }
    .flex-gap {
      display: flex;
      gap: 8px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      font-size: 0.95em;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 12px;
      font-size: 0.85em;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-green  { background-color: #16a34a; }
    .btn-blue   { background-color: #2563eb; }
    .btn-red    { background-color: #dc2626; }
    .btn-orange { background-color: #ea580c; }
    .btn-purple { background-color: #9333ea; }
    .btn-slate  { background-color: #475569; }

    .player-card {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .player-props {
      font-size: 0.8em;
      color: #64748b;
    }
    .prop-tag {
      display: inline-block;
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 4px;
      margin: 2px;
      font-weight: bold;
    }
    .history {
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.85em;
      color: #475569;
    }
    .history p {
      margin: 4px 0;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏦 Monopoly Master Banker</h1>

  <div class="header-bar">
    <div>⏱️ Game Duration: <span id="timer" class="timer-display">00:00:00</span></div>
    <div>
      <button class="btn-green" id="startTimerBtn" onclick="toggleTimer()">Start</button>
      <button class="btn-slate" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <div class="vault-bar">
    <span>🏠 Houses: <span id="houses">32</span></span>
    <span>🏨 Hotels: <span id="hotels">12</span></span>
  </div>

  <div class="parking-card">
    <div>
      <strong>🚗 Free Parking Jackpot:</strong>
      <div style="font-size: 1.3em; color: #b45309; font-weight: bold;" id="parkingPot">$0</div>
    </div>
    <button class="btn-orange" onclick="claimFreeParking()">Award Jackpot</button>
  </div>

  <div class="section">
    <h3>Add Player</h3>
    <div class="flex-gap">
      <input type="text" id="newPlayerName" placeholder="Player Name (e.g., Alex)">
      <button class="btn-green" onclick="addPlayer()">Add</button>
    </div>
  </div>

  <div class="section">
    <h3>Players List</h3>
    <div id="playerList">
      <p style="color:#94a3b8; text-align:center;"><i>No players added yet.</i></p>
    </div>
  </div>

  <div class="section">
    <h3>Property & Asset Management</h3>
    <label style="font-size:0.85em;">Property Name & Base Cost:</label>
    <div class="flex-gap" style="margin-bottom: 10px;">
      <input type="text" id="propertyName" placeholder="e.g. Boardwalk">
      <input type="number" id="propertyCost" placeholder="Base Cost ($)" style="width: 60%;">
    </div>
    <div class="flex-gap">
      <button class="btn-blue" style="width:100%" onclick="buyProperty()">Buy / Transfer Property</button>
    </div>
  </div>

  <div class="section">
    <h3>Banker Controls</h3>
    
    <label style="font-size:0.85em;">Select Target Player:</label>
    <select id="playerSelect" style="margin-bottom: 10px;">
      <option value="">-- Choose a Player --</option>
    </select>

    <label style="font-size:0.85em;">Amount / Fee ($):</label>
    <input type="number" id="amount" placeholder="e.g. 200 or 400" style="margin-bottom: 10px;">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <button class="btn-green" onclick="payGo()">Pay Pass GO (+$200)</button>
      <button class="btn-red" onclick="chargeBank(false)">Pay Tax/Fee to Bank</button>
      <button class="btn-orange" onclick="chargeBank(true)">Pay Tax to Free Parking</button>
      <button class="btn-blue" onclick="unmortgage()">Lift Mortgage (+10% Fee)</button>
      <button class="btn-slate" onclick="buyBuilding('house')">Buy House (-1)</button>
      <button class="btn-purple" onclick="buyBuilding('hotel')">Buy Hotel (-1)</button>
    </div>
  </div>

  <div class="section">
    <h3>Activity Log</h3>
    <div class="history" id="log">
      <p><i>Banker tools online.</i></p>
    </div>
  </div>
</div>

<script>
  let players = [];
  let houses = 32;
  let hotels = 12;
  let freeParkingPot = 0;

  // Timer Variables
  let timerInterval = null;
  let secondsElapsed = 0;

  function toggleTimer() {
    const btn = document.getElementById("startTimerBtn");
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
      btn.textContent = "Start";
      btn.className = "btn-green";
    } else {
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
      }, 1000);
      btn.textContent = "Pause";
      btn.className = "btn-orange";
    }
  }

  function resetTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = null;
    secondsElapsed = 0;
    updateTimerDisplay();
    document.getElementById("startTimerBtn").textContent = "Start";
    document.getElementById("startTimerBtn").className = "btn-green";
  }

  function updateTimerDisplay() {
    const hrs = String(Math.floor(secondsElapsed / 3600)).padStart(2, '0');
    const mins = String(Math.floor((secondsElapsed % 3600) / 60)).padStart(2, '0');
    const secs = String(secondsElapsed % 60).padStart(2, '0');
    document.getElementById("timer").textContent = `${hrs}:${mins}:${secs}`;
  }

  function logAction(msg) {
    const log = document.getElementById("log");
    const entry = document.createElement("p");
    entry.textContent = `• ${msg}`;
    log.prepend(entry);
  }

  function renderPlayers() {
    const list = document.getElementById("playerList");
    const select = document.getElementById("playerSelect");
    
    list.innerHTML = "";
    select.innerHTML = '<option value="">-- Choose a Player --</option>';

    if (players.length === 0) {
      list.innerHTML = '<p style="color:#94a3b8; text-align:center;"><i>No players added yet.</i></p>';
      return;
    }

    players.forEach((p, index) => {
      // Build Player Card
      const card = document.createElement("div");
      card.className = "player-card";
      
      let propsHTML = p.properties.length > 0 
        ? p.properties.map(pr => `<span class="prop-tag">${pr}</span>`).join(" ") 
        : "<i>None</i>";

      card.innerHTML = `
        <div class="player-header">
          <span>${p.name}</span>
          <span style="color:#16a34a;">$${p.balance}</span>
        </div>
        <div class="player-props"><strong>Properties:</strong> ${propsHTML}</div>
      `;
      list.appendChild(card);

      // Build Select Option
      const opt = document.createElement("option");
      opt.value = index;
      opt.textContent = `${p.name} ($${p.balance})`;
      select.appendChild(opt);
    });
  }

  function addPlayer() {
    const input = document.getElementById("newPlayerName");
    const name = input.value.trim();
    if (!name) return alert("Enter a valid player name!");

    players.push({ name: name, balance: 1500, properties: [] });
    input.value = "";
    logAction(`Added player "${name}" with starting balance of $1,500.`);
    renderPlayers();
  }

  function getSelectedPlayer() {
    const select = document.getElementById("playerSelect");
    const idx = select.value;
    if (idx === "") {
      alert("Please select a target player from the dropdown menu first!");
      return null;
    }
    return players[idx];
  }

  function payGo() {
    const player = getSelectedPlayer();
    if (!player) return;

    player.balance += 200;
    logAction(`Bank paid $200 GO salary to ${player.name}.`);
    renderPlayers();
  }

  function chargeBank(toFreeParking) {
    const player = getSelectedPlayer();
    if (!player) return;

    const amountInput = document.getElementById("amount");
    const val = parseFloat(amountInput.value);

    if (!val || val <= 0) return alert("Please enter a valid dollar amount!");

    player.balance -= val;

    if (toFreeParking) {
      freeParkingPot += val;
      document.getElementById("parkingPot").textContent = `$${freeParkingPot}`;
      logAction(`${player.name} paid $${val} tax to Free Parking Pot.`);
    } else {
      logAction(`${player.name} paid $${val} to the Bank.`);
    }

    amountInput.value = "";
    renderPlayers();
  }

  function claimFreeParking() {
    const player = getSelectedPlayer();
    if (!player) return;

    if (freeParkingPot === 0) return alert("Free Parking Pot is currently empty!");

    player.balance += freeParkingPot;
    logAction(`${player.name} collected the Free Parking Jackpot of $${freeParkingPot}!`);
    freeParkingPot = 0;
    document.getElementById("parkingPot").textContent = "$0";
    renderPlayers();
  }

  function buyProperty() {
    const player = getSelectedPlayer();
    if (!player) return;

    const propInput = document.getElementById("propertyName");
    const costInput = document.getElementById("propertyCost");

    const propName = propInput.value.trim();
    const cost = parseFloat(costInput.value);

    if (!propName || !cost || cost <= 0) return alert("Enter a valid property name and cost!");

    player.balance -= cost;
    player.properties.push(propName);

    logAction(`${player.name} purchased ${propName} from Bank for $${cost}.`);

    propInput.value = "";
    costInput.value = "";
    renderPlayers();
  }

  function unmortgage() {
    const player = getSelectedPlayer();
    if (!player) return;

    const amountInput = document.getElementById("amount");
    const basePrice = parseFloat(amountInput.value);

    if (!basePrice || basePrice <= 0) return alert("Please enter the property's base standard cost!");

    const mortgageValue = basePrice / 2;
    const fee = mortgageValue * 0.10;
    const totalToPay = mortgageValue + fee;

    player.balance -= totalToPay;
    logAction(`${player.name} unmortgaged property ($${basePrice} base): Paid Bank $${totalToPay} ($${mortgageValue} + $${fee} fee).`);
    amountInput.value = "";
    renderPlayers();
  }

  function buyBuilding(type) {
    const player = getSelectedPlayer();
    if (!player) return;

    if (type === 'house') {
      if (houses <= 0) return alert("No houses remaining in Bank!");
      houses--;
      document.getElementById("houses").textContent = houses;
      logAction(`${player.name} bought a house. Houses left: ${houses}`);
    } else if (type === 'hotel') {
      if (hotels <= 0) return alert("No hotels remaining in Bank!");
      hotels--;
      houses += 4; // Returning 4 houses back to bank supply when upgrading to hotel
      document.getElementById("houses").textContent = houses;
      document.getElementById("hotels").textContent = hotels;
      logAction(`${player.name} bought a hotel (+4 houses returned to Bank). Hotels left: ${hotels}`);
    }
  }
</script>

</body>
</html>

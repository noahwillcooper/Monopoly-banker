<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monopoly Master Banker Dashboard</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    
    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    /* Top Horizontal Bar */
    .top-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 15px;
      border-radius: 10px;
      flex: 1;
      min-width: 250px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
    }

    .timer-display {
      font-size: 1.4em;
      font-weight: bold;
      font-family: monospace;
      color: #38bdf8;
    }

    .vault-display {
      font-weight: bold;
      font-size: 1.1em;
    }

    /* Horizontal Layout Grid */
    .main-content {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    /* Left Sidebar: Setup & Log */
    .sidebar {
      width: 340px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Right Main Area: Player Grid */
    .player-grid {
      flex-grow: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    /* Player Card Styling */
    .player-card {
      background: #1e293b;
      border: 2px solid #3b82f6;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }

    .player-name {
      font-size: 1.2em;
      font-weight: bold;
      color: #f8fafc;
    }

    .player-balance {
      font-size: 1.3em;
      font-weight: bold;
      color: #4ade80;
    }

    .player-props {
      font-size: 0.85em;
      color: #94a3b8;
      min-height: 40px;
    }

    .prop-tag {
      display: inline-block;
      background: #334155;
      color: #f8fafc;
      padding: 3px 8px;
      border-radius: 4px;
      margin: 2px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Input & Button Styles */
    .flex-gap {
      display: flex;
      gap: 6px;
    }

    input, select {
      width: 100%;
      padding: 8px;
      font-size: 0.9em;
      background: #0f172a;
      border: 1px solid #475569;
      color: white;
      border-radius: 6px;
      box-sizing: border-box;
    }

    button {
      padding: 8px 10px;
      font-size: 0.8em;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-green  { background-color: #16a34a; }
    .btn-blue   { background-color: #2563eb; }
    .btn-red    { background-color: #dc2626; }
    .btn-orange { background-color: #ea580c; }
    .btn-purple { background-color: #9333ea; }
    .btn-slate  { background-color: #475569; }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 5px;
    }

    .history {
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.8em;
      color: #94a3b8;
    }

    .history p {
      margin: 4px 0;
      border-bottom: 1px dashed #334155;
      padding-bottom: 2px;
    }

    /* Rent Reference Table */
    .rent-table-container {
      max-height: 250px;
      overflow-y: auto;
      font-size: 0.75em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
    }

    th, td {
      border: 1px solid #334155;
      padding: 4px;
      text-align: center;
    }

    th {
      background: #0f172a;
      color: #38bdf8;
    }
  </style>
</head>

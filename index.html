<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monopoly Advanced Banker</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f5f9;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #0f172a;
      margin-top: 0;
    }
    .vault-bar {
      display: flex;
      justify-content: space-around;
      background: #e2e8f0;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: bold;
      color: #334155;
    }
    .section {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    .section h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #1e293b;
    }
    .flex-gap {
      display: flex;
      gap: 8px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 14px;
      font-size: 0.9em;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-green  { background-color: #16a34a; }
    .btn-blue   { background-color: #2563eb; }
    .btn-red    { background-color: #dc2626; }
    .btn-slate  { background-color: #475569; }
    
    .player-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .player-name {
      font-weight: bold;
      color: #0f172a;
    }
    .player-balance {
      font-size: 1.1em;
      font-weight: bold;
      color: #16a34a;
    }
    .history {
      max-height: 120px;
      overflow-y: auto;
      font-size: 0.85em;
      color: #475569;
    }
    .history p {
      margin: 4px 0;
      border-bottom: 1px dashed #e2e8f0;
      padding-bottom: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏦 Banker Dashboard</h1>

  <div class="vault-bar">
    <span>🏠 Houses: <span id="houses">32</span></span>
    <span>🏨 Hotels: <span id="hotels">12</span></span>
  </div>

  <div class="section">
    <h3>Add Player</h3>
    <div class="flex-gap">
      <input type="text" id="newPlayerName" placeholder="Player Name (e.g., Alex)">
      <button class="btn-green" onclick="addPlayer()">Add</button>
    </div>
  </div>

  <div class="section">
    <h3>Players List</h3>
    <div id="playerList">
      <p style="color:#94a3b8; text-align:center;"><i>No players added yet.</i></p>
    </div>
  </div>

  <div class="section">
    <h3>Banker Controls</h3>
    
    <label for="playerSelect" style="font-size:0.85em;">Select Target Player:</label>
    <select id="playerSelect" style="margin-bottom: 10px;">
      <option value="">-- Choose a Player --</option>
    </select>

    <label for="amount" style="font-size:0.85em;">Amount / Base Price ($):</label>
    <input type="number" id="amount" placeholder="e.g. 200 or 400" style="margin-bottom: 10px;">

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
      <button class="btn-green" onclick="payGo()">Pay Pass GO (+$200)</button>
      <button class="btn-red" onclick="chargeBank()">Collect Cash from Player</button>
      <button class="btn-blue" onclick="unmortgage()">Lift Mortgage (+10% Fee)</button>
      <button class="btn-slate" onclick="buyBuilding('house')">Buy House (-1)</button>
    </div>
  </div>

  <div class="section">
    <h3>Activity Log</h3>
    <div class="history" id="log">
      <p><i>Banker tools online.</i></p>
    </div>
  </div>
</div>

<script>
  let players = [];
  let houses = 32;
  let hotels = 12;

  function logAction(msg) {
    const log = document.getElementById("log");
    const entry = document.createElement("p");
    entry.textContent = `• ${msg}`;
    log.prepend(entry);
  }

  function renderPlayers() {
    const list = document.getElementById("playerList");
    const select = document.getElementById("playerSelect");
    
    list.innerHTML = "";
    select.innerHTML = '<option value="">-- Choose a Player --</option>';

    if (players.length === 0) {
      list.innerHTML = '<p style="color:#94a3b8; text-align:center;"><i>No players added yet.</i></p>';
      return;
    }

    players.forEach((p, index) => {
      // Build Card
      const card = document.createElement("div");
      card.className = "player-card";
      card.innerHTML = `
        <span class="player-name">${p.name}</span>
        <span class="player-balance">$${p.balance}</span>
      `;
      list.appendChild(card);

      // Build Select Option
      const opt = document.createElement("option");
      opt.value = index;
      opt.textContent = `${p.name} ($${p.balance})`;
      select.appendChild(opt);
    });
  }

  function addPlayer() {
    const input = document.getElementById("newPlayerName");
    const name = input.value.trim();
    if (!name) return alert("Enter a valid name!");

    players.push({ name: name, balance: 1500 });
    input.value = "";
    logAction(`Added player "${name}" with starting balance of $1,500.`);
    renderPlayers();
  }

  function getSelectedPlayer() {
    const select = document.getElementById("playerSelect");
    const idx = select.value;
    if (idx === "") {
      alert("Please select a target player from the dropdown menu first!");
      return null;
    }
    return players[idx];
  }

  function payGo() {
    const player = getSelectedPlayer();
    if (!player) return;

    player.balance += 200;
    logAction(`Bank paid $200 GO salary to ${player.name}.`);
    renderPlayers();
  }

  function chargeBank() {
    const player = getSelectedPlayer();
    if (!player) return;

    const amountInput = document.getElementById("amount");
    const val = parseFloat(amountInput.value);

    if (!val || val <= 0) return alert("Please enter a valid dollar amount!");

    player.balance -= val;
    logAction(`${player.name} paid $${val} to the Bank.`);
    amountInput.value = "";
    renderPlayers();
  }

  function unmortgage() {
    const player = getSelectedPlayer();
    if (!player) return;

    const amountInput = document.getElementById("amount");
    const basePrice = parseFloat(amountInput.value);

    if (!basePrice || basePrice <= 0) return alert("Please enter the property's base standard cost!");

    const mortgageValue = basePrice / 2;
    const fee = mortgageValue * 0.10;
    const totalToPay = mortgageValue + fee;

    player.balance -= totalToPay;
    logAction(`${player.name} unmortgaged property ($${basePrice} base): Paid Bank $${totalToPay} ($${mortgageValue} + $${fee} fee).`);
    amountInput.value = "";
    renderPlayers();
  }

  function buyBuilding(type) {
    const player = getSelectedPlayer();
    if (!player) return;

    if (type === 'house') {
      if (houses <= 0) return alert("No houses remaining in Bank!");
      houses--;
      document.getElementById("houses").textContent = houses;
      logAction(`${player.name} bought a house. Houses remaining: ${houses}`);
    }
  }
</script>

</body>
</html>
